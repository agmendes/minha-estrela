<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Céu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b061a;
            /* Imagem de fundo */
            background-image: url('fundo.jpg'); /* Altere para o nome/extensão correta da sua imagem (ex: fundo.png) */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Cabeçalho */
        .header-info {
            position: absolute;
            top: 30px;
            left: 50px;
            color: #fce4ec;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }

        .header-info h1 {
            font-size: 1.5rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-info p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* Texto no Meio do Coração */
        .heart-center {
            position: absolute;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fce4ec;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
            z-index: 10;
            pointer-events: none;
        }

        .heart-center h2 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .heart-center .heart-symbol {
            font-size: 1rem;
            color: #f48fb1;
            animation: pulse 2s infinite alternate;
            letter-spacing: 0.5px;
        }

        /* Estrelas Clicáveis */
        .star-spot {
            position: absolute;
            cursor: pointer;
            text-align: center;
            transform: translate(-50%, -50%);
            transition: transform 0.3s ease;
        }

        .star-spot:hover {
            transform: translate(-50%, -50%) scale(1.3);
        }

        .star-icon {
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 10px #ffeb3b, 0 0 20px #ff9800;
            display: block;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        /* Modal / Caixa Pop-up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 15, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(26, 15, 43, 0.95);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 182, 193, 0.2);
            color: #fff;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #fce4ec;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .modal-image {
            width: 100%;
            max-height: 260px;
            object-fit: contain; /* Mantém a foto inteira sem cortar */
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-heart {
            font-size: 0.9rem;
            color: #f48fb1;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #e1bee7;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Título do Topo -->
    <div class="header-info">
        <h1>Para a minha amada ♡</h1>
        <p>Você é a mais brilhante das estrelas...</p>
    </div>

    <!-- Texto no Centro do Coração (Contador Atualizado) -->
    <div class="heart-center">
        <h2 id="counterText">Calculando dias...</h2>
        <div class="heart-symbol">até o infinito</div>
    </div>

    <!-- ================= ESTRELAS EM FORMATO DE CORAÇÃO HARMONIOSO ================= -->
    
    <!-- Estrela do V Central Superior -->
    <div class="star-spot" style="top: 33%; left: 50%;" onclick="openModal('', '1.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <!-- Lado Esquerdo Superior do Coração -->
    <div class="star-spot" style="top: 30%; left: 44%;" onclick="openModal('', '2.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 27%; left: 37%;" onclick="openModal('', '3.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 29%; left: 29%;" onclick="openModal('', '4.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 34%; left: 23%;" onclick="openModal('', '5.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <!-- Lado Direito Superior do Coração -->
    <div class="star-spot" style="top: 30%; left: 56%;" onclick="openModal('', '6.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 27%; left: 63%;" onclick="openModal('', '7.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 29%; left: 71%;" onclick="openModal('', '8.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 34%; left: 77%;" onclick="openModal('', '9.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <!-- Parte Inferior do Coração -->
    <div class="star-spot" style="top: 41%; left: 22%;" onclick="openModal('', '10.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 41%; left: 78%;" onclick="openModal('', '11.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 46%; left: 28%;" onclick="openModal('', '12.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 46%; left: 72%;" onclick="openModal('', '13.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <div class="star-spot" style="top: 51%; left: 35%;" onclick="openModal('', '14.jpg')">

    </div>

    <div class="star-spot" style="top: 51%; left: 65%;" onclick="openModal('', '15.jpg')">

    </div>

    <div class="star-spot" style="top: 59%; left: 50%;" onclick="openModal('', '16.jpg')">
        <span class="star-icon">✦</span>
    </div>
    
    <div class="star-spot" style="top: 55%; left: 42%;" onclick="openModal('', '17.jpg')">
        <span class="star-icon">✦</span>
    </div>
    
    <div class="star-spot" style="top: 55%; left: 58%;" onclick="openModal('', '18.jpg')">
        <span class="star-icon">✦</span>
    </div>

    <!-- ================= FIM DAS ESTRELAS ================= -->

    <!-- Caixa Modal (Pop-up) -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal-card" id="modalCard">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <img src="" alt="Foto do Momento" class="modal-image" id="modalImg">
            <div class="modal-heart">♡</div>
            <p class="modal-desc" id="modalDesc"></p>
        </div>
    </div>

    <script>
        // Função para calcular os dias desde 23 de agosto de 2026
        function updateCounter() {
            const startDate = new Date('2026-08-23T00:00:00');
            const now = new Date();
            
            // Diferença em milissegundos
            const diffTime = now - startDate;
            
            // Converte para dias (arredondando para baixo)
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // Exibe o texto formatado no elemento
            const counterElement = document.getElementById('counterText');
            if (diffDays >= 0) {
                counterElement.innerText = `juntos há ${diffDays} dias`;
            } else {
                counterElement.innerText = `Faltam ${Math.abs(diffDays)} dias para o dia 23/08/2026`;
            }
        }

        // Executa ao carregar a página
        updateCounter();

        // Funções da Modal
        function openModal(desc, imgSrc) {
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalImg').src = imgSrc;
            
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOutside(event) {
            const card = document.getElementById('modalCard');
            if (!card.contains(event.target)) {
                closeModal();
            }
        }
    </script>
</body>
</html>
